<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6B2737">
  <title>FoodCritic Fácil</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍝%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://byycxurjjonbhrreoost.supabase.co" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/lite.css">
  <link rel="stylesheet" href="css/flow.css">
</head>
<body class="is-booting">
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <div class="app-layout">
    <!-- Menu lateral (desktop) -->
    <aside class="sidebar-left" aria-label="Menu principal">
      <p class="logo-sidebar">FoodCritic</p>
      <nav class="nav-menu">
        <button type="button" class="nav-btn active" data-nav="inicio" data-go="inicio">
          <i class="fas fa-home" aria-hidden="true"></i> <span>Início</span>
        </button>
        <button type="button" class="nav-btn" data-nav="carrinho" data-go="carrinho">
          <i class="fas fa-shopping-bag" aria-hidden="true"></i> <span>Carrinho</span>
          <span id="cart-badge-sidebar" class="badge" hidden>0</span>
        </button>
        <button type="button" class="nav-btn" data-nav="pedido" data-go="pedido">
          <i class="fas fa-receipt" aria-hidden="true"></i> <span>Meu Pedido</span>
        </button>
      </nav>
      <div class="sidebar-left-footer">
        <div id="sidebar-left-profile" class="sidebar-left-profile"></div>
        <button type="button" class="btn-logout-sidebar" data-action="logout">
          <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
          <span>Sair da conta</span>
        </button>
      </div>
    </aside>

    <!-- Conteúdo -->
    <main class="main-content">
      <div id="view-content">
        <noscript><p class="empty-inline">Ative o JavaScript para usar o FoodCritic Fácil.</p></noscript>
      </div>
    </main>

    <!-- Perfil no desktop fica na sidebar esquerda -->
  </div>

  <!-- Carrinho flutuante (mobile) -->
  <button type="button" id="cart-bar" class="cart-bar" data-action="open-cart" hidden>
    <span class="cart-bar-count" aria-hidden="true">0</span>
    <span class="cart-bar-label">Ver carrinho</span>
    <span class="cart-bar-total">R$ 0,00</span>
  </button>

  <!-- Menu inferior (mobile) -->
  <nav class="bottom-nav" aria-label="Menu principal">
    <button type="button" class="nav-btn active" data-nav="inicio" data-go="inicio">
      <i class="fas fa-home" aria-hidden="true"></i><span>Início</span>
    </button>
    <button type="button" class="nav-btn" data-nav="carrinho" data-go="carrinho">
      <i class="fas fa-shopping-bag" aria-hidden="true"></i><span>Carrinho</span>
      <span id="cart-badge-mobile" class="badge" hidden>0</span>
    </button>
    <button type="button" class="nav-btn" data-nav="pedido" data-go="pedido">
      <i class="fas fa-receipt" aria-hidden="true"></i><span>Pedido</span>
    </button>
    <button type="button" class="nav-btn nav-btn-logout" data-action="logout">
      <i class="fas fa-sign-out-alt" aria-hidden="true"></i><span>Sair</span>
    </button>
  </nav>

  <!-- Confirmação (usada por askConfirm) -->
  <dialog id="confirm-dialog" class="dialog" aria-labelledby="dlg-title">
    <form method="dialog">
      <h2 id="dlg-title" data-dlg-title></h2>
      <p class="muted" data-dlg-text></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn-big btn-big-ghost btn-big-sm" data-dlg-cancel autofocus>Cancelar</button>
        <button value="ok" class="btn-big btn-big-primary btn-big-sm" data-dlg-ok>Confirmar</button>
      </div>
    </form>
  </dialog>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
