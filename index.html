<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodCritic Fácil</title>
  
  <!-- Fontes -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  
  <!-- MAPA (Leaflet) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toast-container" class="toast-container"></div>

  <div class="app-layout">
    <!-- Sidebar Esquerda -->
    <aside class="sidebar-left">
      <h1 class="logo-sidebar">FoodCritic</h1>
      <nav class="nav-menu">
        <button class="nav-btn active" data-nav="inicio" onclick="go('inicio')">
          <i class="fas fa-home"></i> <span>Início</span>
        </button>
        <button class="nav-btn" data-nav="carrinho" onclick="go('carrinho')">
          <i class="fas fa-shopping-bag"></i> <span>Carrinho</span>
          <span id="cart-badge-sidebar" class="badge" hidden>0</span>
        </button>
        <button class="nav-btn" data-nav="pedido" onclick="go('pedido')">
          <i class="fas fa-receipt"></i> <span>Meu Pedido</span>
        </button>
      </nav>
        <!-- Adicione dentro da <nav class="nav-menu"> da sidebar-esquerda: -->
        <button class="nav-btn" data-nav="cadastrar" onclick="go('cadastrar')">
        <i class="fas fa-plus-circle"></i> <span>Nova Loja</span>
        </button>
      <button class="btn-logout-sidebar" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i> <span>Sair</span>
      </button>
    </aside>

    <!-- Conteúdo Central -->
    <main class="main-content">
      <div id="view-content"></div>
    </main>

    <!-- Sidebar Direita (Carrinho) -->
    <aside class="sidebar-right">
      <div id="sidebar-right-content"></div>
    </aside>
  </div>

  <!-- Bottom Nav (Mobile) -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-nav="inicio" onclick="go('inicio')">
      <i class="fas fa-home"></i><span>Início</span>
    </button>
    <button class="nav-btn" data-nav="carrinho" onclick="go('carrinho')">
      <i class="fas fa-shopping-bag"></i><span>Carrinho</span>
      <span id="cart-badge-mobile" class="badge" hidden>0</span>
    </button>
    <!-- E adicione dentro da <nav class="bottom-nav">: -->
    <button class="nav-btn" data-nav="cadastrar" onclick="go('cadastrar')">
        <i class="fas fa-plus-circle"></i><span>Loja</span>
    </button>
    <button class="nav-btn" data-nav="pedido" onclick="go('pedido')">
      <i class="fas fa-receipt"></i><span>Pedido</span>
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
